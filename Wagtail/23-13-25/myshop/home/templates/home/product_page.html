{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}

{% block content %}
<style>
    .mobile-actions {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: white; display: flex; padding: 10px;
        gap: 10px; border-top: 1px solid #eee; z-index: 1020;
    }
    @media (min-width: 768px) { .mobile-actions { display: none; } }
</style>

<div class="container mt-md-4 px-0 px-md-3">
    <div class="row g-0 g-md-4 bg-white shadow-sm rounded">
        <div class="col-md-5">
            {% if self.image %}
                {% image self.image width-600 class="img-fluid" %}
            {% else %}
                <img src="https://via.placeholder.com/600" class="img-fluid">
            {% endif %}
        </div>

        <div class="col-md-7 p-3 p-md-4">
            <h4 class="fw-normal">{{ self.title }}</h4>
            <div class="bg-light p-3 my-3">
                <h3 class="text-danger fw-bold mb-0">Rp{{ self.price }}</h3>
            </div>

            <div class="d-none d-md-flex align-items-center mb-4">
                <span class="text-muted me-3 small">Kuantitas</span>
                <div class="input-group w-25">
                    <button class="btn btn-outline-secondary" onclick="changeQty(-1)">-</button>
                    <input type="text" id="qty-input" class="form-control text-center" value="1" readonly>
                    <button class="btn btn-outline-secondary" onclick="changeQty(1)">+</button>
                </div>
            </div>

            <div class="d-none d-md-flex gap-2">
                <button class="btn btn-outline-danger btn-lg px-4" onclick="addToCart()" style="color:var(--myshop-orange); border-color:var(--myshop-orange);">🛒 Masukkan Keranjang</button>
                <button class="btn btn-danger btn-lg px-5" style="background:var(--myshop-orange); border:none;">Beli Sekarang</button>
            </div>
        </div>
    </div>

    <div class="bg-white mt-3 p-3 shadow-sm rounded">
        <h6 class="border-bottom pb-2 fw-bold">DESKRIPSI PRODUK</h6>
        <div class="mt-3 small">{{ self.description|richtext }}</div>
    </div>
</div>

<div class="mobile-actions">
    <button class="btn btn-outline-danger flex-grow-1" onclick="addToCart()">🛒 +Keranjang</button>
    <button class="btn btn-danger flex-grow-1" style="background:var(--myshop-orange); border:none;">Beli Sekarang</button>
</div>

<script>
    function changeQty(n) {
        let i = document.getElementById('qty-input');
        let v = parseInt(i.value) + n;
        if (v >= 1) i.value = v;
    }

    function addToCart() {
        const qty = parseInt(document.getElementById('qty-input')?.value || 1);
        const product = {
            id: "{{ self.id }}",
            title: "{{ self.title }}",
            price: "{{ self.price }}",
            qty: qty,
            image: "{% if self.image %}{% image self.image fill-100x100 as img %}{{ img.url }}{% endif %}"
        };
        let cart = JSON.parse(localStorage.getItem('my_cart') || "[]");
        let idx = cart.findIndex(item => item.id === product.id);
        if (idx > -1) cart[idx].qty += qty; else cart.push(product);
        
        localStorage.setItem('my_cart', JSON.stringify(cart));
        window.updateCartUI();
        
        const t = document.getElementById('toast-msg');
        t.innerText = "✅ Berhasil ditambah ke keranjang!";
        t.style.display = "block";
        setTimeout(() => t.style.display = "none", 2000);
    }
</script>
{% endblock %}
