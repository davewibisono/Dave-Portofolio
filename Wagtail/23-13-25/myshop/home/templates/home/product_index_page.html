{% extends "base.html" %}
{% load wagtailimages_tags %}

{% block content %}
<div class="container mt-4">
    <h3>Rekomendasi</h3>
    <div class="row row-cols-2 row-cols-md-4 row-cols-lg-6 g-3">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 card-product">
                {% image product.image fill-300x300 as img %}
                <img src="{{ img.url }}" class="card-img-top" alt="{{ product.title }}">
                <div class="card-body p-2">
                    <h6 class="card-title text-truncate">{{ product.title }}</h6>
                    <p class="text-danger fw-bold">Rp {{ product.price }}</p>
                    <small class="text-muted">Kota Jakarta</small>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
