{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h4 class="mb-4">Keranjang Belanja</h4>
    <div class="row">
        <div class="col-md-8">
            <div id="cart-items-list" class="bg-white p-3 shadow-sm rounded">
                </div>
        </div>
        <div class="col-md-4">
            <div class="bg-white p-3 shadow-sm rounded">
                <h5>Ringkasan Belanja</h5>
                <hr>
                <div class="d-flex justify-content-between mb-2">
                    <span>Total Harga</span>
                    <span id="total-price" class="fw-bold text-danger">Rp0</span>
                </div>
                <button onclick="checkout()" class="btn btn-danger w-100 fw-bold mt-3">Checkout Sekarang</button>
            </div>
        </div>
    </div>
</div>

<script>
    function displayCart() {
        const container = document.getElementById('cart-items-list');
        let cart = JSON.parse(localStorage.getItem('my_cart') || "[]");
        let total = 0;

        if (cart.length === 0) {
            container.innerHTML = `<div class="text-center py-5"><p>Keranjang kosong</p><a href="/" class="btn btn-danger">Belanja</a></div>`;
            return;
        }

        let html = '';
        cart.forEach((item, index) => {
            let subtotal = parseInt(item.price) * item.qty;
            total += subtotal;
            html += `
                <div class="d-flex align-items-center border-bottom py-3">
                    <img src="${item.image || 'https://via.placeholder.com/80'}" class="rounded me-3" style="width:80px">
                    <div class="flex-grow-1">
                        <h6 class="mb-0">${item.title}</h6>
                        <small class="text-danger">Rp${item.price}</small>
                        <div class="text-muted small">Jumlah: ${item.qty}</div>
                    </div>
                    <div class="fw-bold">Rp${subtotal}</div>
                    <button class="btn btn-link text-muted ms-3" onclick="removeItem(${index})">🗑️</button>
                </div>
            `;
        });
        
        container.innerHTML = html;
        document.getElementById('total-price').innerText = "Rp" + total;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('my_cart') || "[]");
        cart.splice(index, 1);
        localStorage.setItem('my_cart', JSON.stringify(cart));
        
        // Update angka navbar
        let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        localStorage.setItem('cartCount', totalQty);
        updateCartUI();
        
        displayCart();
    }

    displayCart();
</script>
{% endblock %}
