{% load static wagtailcore_tags wagtailuserbar %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <title>MyShop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --myshop-orange: #ee4d2d; }
        body { background-color: #f5f5f5; min-height: 100vh; padding-bottom: 60px; }
        
        /* Navbar Sticky */
        .sticky-navbar {
            position: sticky; top: 0; z-index: 1020;
            background-color: var(--myshop-orange);
            padding: 10px 0;
        }
        .search-bar { border-radius: 4px 0 0 4px; border: none; }
        .search-btn { border-radius: 0 4px 4px 0; border: none; background: #fff; color: var(--myshop-orange); }

        /* Card Produk ala Shopee */
        .product-card {
            background: #fff; border-radius: 2px; text-decoration: none;
            color: black; display: block; height: 100%; transition: 0.2s;
        }
        .product-card:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); color: black; }
        .price-tag { color: var(--myshop-orange); font-weight: 500; }

        /* Toast Popup (Mobile & Desktop) */
        .custom-toast {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); color: white; padding: 12px 24px;
            border-radius: 8px; display: none; z-index: 9999; text-align: center;
        }

        /* Bottom Nav Mobile */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 8px 0; border-top: 1px solid #eee; z-index: 1010;
        }
        .bottom-nav a { text-decoration: none; color: #666; font-size: 11px; text-align: center; }
        .bottom-nav i { display: block; font-size: 18px; margin-bottom: 2px; }
        
        @media (min-width: 768px) { .bottom-nav { display: none; } body { padding-bottom: 0; } }
    </style>
</head>
<body>
    {% wagtailuserbar %}
    
    <nav class="sticky-navbar shadow-sm">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="navbar-brand fw-bold text-white d-none d-md-block" href="/">🛍️ MY SHOP</a>
            <a class="text-white d-md-none text-decoration-none fs-4 me-2" href="/">🏠</a>
            
            <form class="input-group" style="max-width: 600px;" action="/search/" method="get">
                <input type="text" name="query" class="form-control search-bar" placeholder="Cari di MyShop...">
                <button class="btn search-btn" type="submit">🔍</button>
            </form>

            <a href="/cart/" class="text-white fw-bold text-decoration-none ms-2 position-relative">
                🛒<span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-dark" style="font-size: 10px;">0</span>
            </a>
        </div>
    </nav>

    <div id="toast-msg" class="custom-toast"></div>

    {% block content %}{% endblock %}

    <div class="bottom-nav">
        <a href="/"><i>🏠</i>Home</a>
        <a href="/cart/"><i>🛒</i>Keranjang</a>
        <a href="/admin/"><i>👤</i>Saya</a>
    </div>

    <script>
        window.updateCartUI = function() {
            const cart = JSON.parse(localStorage.getItem('my_cart') || "[]");
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if (badge) badge.innerText = totalQty;
        };
        document.addEventListener('DOMContentLoaded', window.updateCartUI);
    </script>
</body>
</html>
