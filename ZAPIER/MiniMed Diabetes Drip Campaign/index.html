<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>MiniMed Diabetes Drip Campaign</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="images/logo-web.png" type="image/x-icon">
    <link rel="icon" href="images/logo-web.png" type="image/png">

    <style type="text/css">
      /* Container Utama */
      #mc_embed_signup {
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 480px;
        width: 100%;
        margin: 40px auto;
        padding: 32px 28px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        box-sizing: border-box;
      }

      /* Logo Brand Header */
      .form-logo {
        display: block;
        max-width: 140px;
        height: auto;
        margin: 0 auto;
      }

      #mc_embed_signup .asterisk {
        color: #e53e3e;
      }

      /* Group Field Input */
      #mc_embed_signup .mc-field-group {
        width: 100%;
        margin-bottom: 18px;
        padding-bottom: 0;
      }

      /* Label Input */
      #mc_embed_signup .mc-field-group label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: #333333;
        margin-bottom: 6px;
      }

      /* Elemen Input Form */
      #mc_embed_signup input[type="text"],
      #mc_embed_signup input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 14px;
        border: 1.5px solid #e2e8f0;
        border-radius: 8px;
        box-sizing: border-box;
        transition: all 0.2s ease-in-out;
        outline: none;
        background-color: #f8fafc;
      }

      #mc_embed_signup input[type="text"]:focus,
      #mc_embed_signup input[type="email"]:focus {
        border-color: #3182ce;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
      }

      /* Tombol Submit */
      #mc_embed_signup button[type="submit"] {
        width: 100% !important;
        height: auto;
        padding: 12px 20px;
        background-color: #3182ce;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        margin-top: 10px;
        display: block;
      }

      #mc_embed_signup button[type="submit"]:hover {
        background-color: #2b6cb0;
      }

      #mc_embed_signup button[type="submit"]:active {
        transform: scale(0.98);
      }

      #mc_embed_signup button[type="submit"]:disabled {
        background-color: #a0aec0;
        cursor: not-allowed;
      }

      /* Pesan Notifikasi Sukses / Error */
      .form-message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
        display: none;
      }
      .form-message.success {
        background-color: #c6f6d5;
        color: #22543d;
      }
      .form-message.error {
        background-color: #fed7d7;
        color: #742a2a;
      }
    </style>
</head>

<body>

    <div id="mc_embed_shell">
      <div id="mc_embed_signup">
        <!-- Form Kustom tanpa mengarah ke Mailchimp -->
        <form id="custom-subscribe-form">
          <div id="mc_embed_signup_scroll">
            
            <!-- LOGO BRAND DI ATAS -->
            <div style="text-align: center; margin-bottom: 25px;">
              <img src="images/hero-logo.png" alt="Logo" class="form-logo" style="max-width: 160px; height: auto; display: inline-block;">
            </div>

            <div class="mc-field-group">
              <label for="mce-EMAIL">Email Address <span class="asterisk">*</span></label>
              <input type="email" name="EMAIL" id="mce-EMAIL" required placeholder="name@gmail.com">
            </div>

            <div class="mc-field-group">
              <label for="mce-FNAME">First Name</label>
              <input type="text" name="FNAME" id="mce-FNAME" placeholder="First Name">
            </div>

            <div class="mc-field-group">
              <label for="mce-LNAME">Last Name</label>
              <input type="text" name="LNAME" id="mce-LNAME" placeholder="Last Name">
            </div>

            <div>
              <button type="submit" id="submit-btn">Subscribe</button>
            </div>

            <!-- Kontainer Pesan Response -->
            <div id="form-message" class="form-message"></div>

          </div>
        </form>
      </div>
    </div>

    <script>
      // ⚠️ GANTI DENGAN WEBHOOK URL DARI NODE WEBHOOK DI N8N KAMU ⚠️
      const N8N_WEBHOOK_URL = 'https://hivuwik.app.n8n.cloud/webhook/d2d891d6-a912-471d-9c34-1d64dac9488d';

      const form = document.getElementById('custom-subscribe-form');
      const submitBtn = document.getElementById('submit-btn');
      const messageBox = document.getElementById('form-message');

      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        // Ubah status tombol saat loading
        submitBtn.disabled = true;
        submitBtn.innerText = 'Sending...';
        messageBox.style.display = 'none';

        // Ambil data dari input form
        const payload = {
          email: document.getElementById('mce-EMAIL').value,
          first_name: document.getElementById('mce-FNAME').value,
          last_name: document.getElementById('mce-LNAME').value,
          date_subscribed: new Date().toISOString()
        };

        try {
          // Kirim data ke n8n via Webhook
          const response = await fetch(N8N_WEBHOOK_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (response.ok) {
            messageBox.className = 'form-message success';
            messageBox.innerText = 'Terima kasih sudah mendaftar!';
            messageBox.style.display = 'block';
            
            // 🛑 HILANGKAN TOMBOL SETELAH BERHASIL
            submitBtn.style.display = 'none'; 
            
            form.reset(); // Clear isian form
          } else {
            throw new Error('Gagal mengirim data');
          }
        } catch (error) {
          messageBox.className = 'form-message error';
          messageBox.innerText = 'Terjadi kesalahan. Silakan coba lagi.';
          messageBox.style.display = 'block';
          
          // Kalau gagal, aktifkan lagi tombolnya
          submitBtn.disabled = false;
          submitBtn.innerText = 'Subscribe';
        }
      });
    </script>

</body>
</html>
