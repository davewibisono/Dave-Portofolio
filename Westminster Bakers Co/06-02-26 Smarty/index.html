<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Westminster Bakers</title>

<link rel="icon" href="images/logo.png" />
<link rel="stylesheet" href="css/style.css">

<style>
.suggestions-list{
 position:absolute;
 top:100%;
 left:0;
 width:100%;
 background:#fff;
 border:1px solid #ccc;
 z-index:999;
}
.suggestion-item{
 padding:10px;
 cursor:pointer;
}
.suggestion-item:hover{
 background:#eee;
}
</style>

</head>

<body>
<div class="body-container">

<nav class="navbar">
<div class="navbar-container">
<a href="#" style="height:84px;">
<img src="images/logo.png" class="navbar-logo">
</a>
</div>
</nav>

<section class="hero-section container" style="padding-bottom:0;">
<h2>Get in Full Swing for Soup Season.</h2>
<hr class="line-divider-top">
<p>Request Westminster’s clean-label crackers, the perfect complement for soup, chili, and seasonal bowls.</p>
</section>

<img src="images/soup.png" class="soup-img">

<section class="fill-out container">
<h5>Fill out the form below for your free sample.</h5>
<hr class="line-divider-bottom">
</section>

<section class="form-section container" style="margin-top:0;">

<form class="request-form" action="https://formspree.io/f/maqbrlke" method="POST">

<input type="hidden" name="_subject" value="Westminster free sample request">

<label>Name*</label>
<div class="form-row two-col">
<div class="input-container">
<input type="text" name="first_name" placeholder="First Name" required>
</div>
<div class="input-container">
<input type="text" name="last_name" placeholder="Last Name" required>
</div>
</div>

<label>Business Name*</label>
<div class="input-container">
<input type="text" name="business_name" required>
</div>

<label>Company Address*</label>
<div class="input-container" style="position:relative;">
<input type="text" name="address_1" id="address_1" autocomplete="off" required>
<div id="address-suggestions" class="suggestions-list"></div>
</div>

<input type="text" name="address_2" placeholder="Street Address line 2">

<div class="form-row two-col">
<input type="text" name="city" placeholder="City" readonly required>
<input type="text" name="state" placeholder="State" readonly required>
</div>

<input type="text" name="zip" placeholder="Zip" readonly required>

<div class="form-row two-col">
<div class="input-container">
<label>Phone*</label>
<input type="tel" name="phone" required>
</div>
<div class="input-container">
<label>Email*</label>
<input type="email" name="email" required>
</div>
</div>

<button type="submit" class="btn-submit">SUBMIT</button>

</form>
</section>
</div>

<script src="js/script.js"></script>
</body>
</html>
