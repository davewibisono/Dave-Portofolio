<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disappearing Text Writing App</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body class="bg-dark text-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h1 class="fw-bold mb-2 text-warning">
            <i class="fa-solid fa-fire me-2"></i>Dangerous Writing Assistant
          </h1>
          <p class="text-muted mb-4">
            Jangan berhenti mengetik! Jika Anda berhenti selama lebih dari
            <strong>5 detik</strong>, seluruh tulisan Anda akan lenyap.
          </p>

          <!-- Status Indikator -->
          <div class="mb-3">
            <span id="status-badge" class="badge bg-secondary fs-6 px-3 py-2"
              >Mulai mengetik untuk mulai...</span
            >
          </div>

          <div class="card bg-secondary border-0 shadow-lg p-3">
            <textarea
              id="writing-area"
              class="form-control bg-dark text-light border-0 p-4"
              rows="12"
              placeholder="Tulis ide atau cerita Anda di sini... Kecepatan adalah segalanya!"
            ></textarea>
          </div>

          <div class="mt-4">
            <button
              id="download-btn"
              class="btn btn-outline-success btn-lg px-4"
              style="display: none"
            >
              <i class="fa-solid fa-download me-2"></i>Download Tulisan
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const textarea = document.getElementById("writing-area");
      const statusBadge = document.getElementById("status-badge");
      const downloadBtn = document.getElementById("download-btn");

      let timeout;
      let isStarted = false;
      const limit = 5000; // 5 detik

      textarea.addEventListener("input", () => {
        if (!isStarted) {
          isStarted = true;
        }

        statusBadge.className = "badge bg-success fs-6 px-3 py-2";
        statusBadge.textContent = "Menulis... (Jangan berhenti!)";
        downloadBtn.style.display = "inline-block";

        clearTimeout(timeout);

        timeout = setTimeout(() => {
          textarea.value = "";
          statusBadge.className = "badge bg-danger fs-6 px-3 py-2";
          statusBadge.textContent =
            "Waktu habis! Tulisan Anda lenyap karena berhenti.";
          downloadBtn.style.display = "none";
          isStarted = false;
        }, limit);
      });

      downloadBtn.addEventListener("click", () => {
        const text = textarea.value;
        if (!text.trim()) return;
        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "my-writing.txt";
        a.click();
      });
    </script>
  </body>
</html>
