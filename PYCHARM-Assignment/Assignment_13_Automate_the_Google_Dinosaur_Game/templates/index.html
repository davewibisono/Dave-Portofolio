<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Color Palette Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .color-box {
            height: 120px;
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .color-box:hover {
            transform: translateY(-5px);
        }
        .hex-code {
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        .preview-img {
            max-height: 350px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="fw-bold">🎨 Image Palette Generator</h1>
            <p class="text-muted">Upload sebuah gambar untuk mendapatkan palet warna dominannya secara otomatis.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm mb-4">
                    <form action="/" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="image_file" class="form-label font-weight-bold">Pilih File Gambar (JPG, PNG)</label>
                            <input class="form-control" type="file" id="image_file" name="image_file" accept="image/*" required>
                        </div>
                        <div class="mb-3">
                            <label for="num_colors" class="form-label">Jumlah Warna:</label>
                            <select class="form-select" name="num_colors" id="num_colors">
                                <option value="4">4 Warna</option>
                                <option value="6" selected>6 Warna</option>
                                <option value="8">8 Warna</option>
                                <option value="10">10 Warna</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ekstrak Warna</button>
                    </form>
                </div>
            </div>
        </div>

        {% if image_url %}
        <hr class="my-5">
        <div class="row text-center mb-4">
            <div class="col">
                <h3>Gambar Asli</h3>
                <img src="{{ image_url }}" class="preview-img mt-3 img-fluid" alt="Uploaded Image">
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-12 text-center mb-3">
                <h3>Palet Warna Hasil Ekstraksi</h3>
            </div>
            {% for color in palette %}
            <div class="col-6 col-sm-4 col-md-2 mb-3">
                <div class="color-box" style="background-color: {{ color }};">
                    <span class="hex-code">{{ color }}</span>
                </div>
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
</body>
</html>
